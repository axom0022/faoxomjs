<!doctype html><meta charset="utf-8"><title>FaoxomJS Advanced Lighting Benchmark</title><pre id="output">running</pre><script type="module">
import { Matrix4 } from "../src/math/index.js";
import { AdvancedLightingPipeline } from "../src/renderers/AdvancedLightingPipeline.js";
import { AdvancedLightingQualityController } from "../src/renderers/AdvancedLightingQualityController.js";

const params=new URLSearchParams(location.search),warmupFrames=Math.max(1,Number(params.get("warmup")||3)),measuredFrames=Math.max(2,Number(params.get("frames")||8));
function summary(values){const sorted=values.slice().sort((a,b)=>a-b),mean=values.reduce((a,b)=>a+b,0)/values.length,variance=values.reduce((a,b)=>a+(b-mean)**2,0)/values.length;return{samples:values.length,minMs:+sorted[0].toFixed(3),meanMs:+mean.toFixed(3),medianMs:+sorted[Math.floor(sorted.length*.5)].toFixed(3),p95Ms:+sorted[Math.min(sorted.length-1,Math.ceil(sorted.length*.95)-1)].toFixed(3),maxMs:+sorted.at(-1).toFixed(3),stddevMs:+Math.sqrt(variance).toFixed(3)};}
function hashBytes(bytes){let hash=2166136261;for(const value of bytes){hash^=value;hash=Math.imul(hash,16777619);}return(hash>>>0).toString(16).padStart(8,"0");}
function estimateBytes(width,height,foveation,rayQuery){const pixels=width*height;let bytes=pixels*(112+32+8+72+8);if(rayQuery)bytes+=pixels*16;if(foveation)bytes+=Math.ceil(width*.25)*Math.ceil(height*.25)*4;return bytes;}
function buffer(device,data,Type=Float32Array){const values=new Type(data),result=device.createBuffer({size:Math.max(16,values.byteLength),usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST});device.queue.writeBuffer(result,0,values);return result;}
function makeRayQuery(device){return{nodebuffer:buffer(device,[-100,-100,.65,100,100,.67,0,1]),trilistbuffer:buffer(device,[0],Uint32Array),tridatabuffer:buffer(device,[-100,-100,.66,100,-100,.66,0,100,.66,0,0,0]),stats:{triangles:1}};}
function makeLights(count){const lights=[];for(let i=0;i<count;i++){const angle=i/count*Math.PI*2;if(i===0)lights.push({direction:[-.3,-1,-.2],color:[1,.92,.78],intensity:3,type:"DirectionalLight"});else lights.push({position:[Math.cos(angle)*8,(i%5)+1,Math.sin(angle)*8],color:[.35+(i%3)*.25,.4+((i+1)%3)*.2,.5+((i+2)%3)*.15],intensity:10+(i%7)});}return lights;}
async function resources(device,width,height){const sampled=GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.COPY_DST,make=(format,usage=sampled)=>device.createTexture({size:[width,height],format,usage}),color=make("rgba8unorm"),normal=make("rgba8unorm"),velocity=make("rg16float"),depth=make("depth32float",GPUTextureUsage.TEXTURE_BINDING|GPUTextureUsage.RENDER_ATTACHMENT);let encoder=device.createCommandEncoder(),pass=encoder.beginRenderPass({colorAttachments:[],depthStencilAttachment:{view:depth.createView(),depthClearValue:.42,depthLoadOp:"clear",depthStoreOp:"store"}});pass.end();device.queue.submit([encoder.finish()]);const bytes=new Uint8Array(width*height*4);for(let y=0;y<height;y++)for(let x=0;x<width;x++){const i=(y*width+x)*4;bytes[i]=40+(x*120/width)|0;bytes[i+1]=55+(y*100/height)|0;bytes[i+2]=90;bytes[i+3]=255;}device.queue.writeTexture({texture:color},bytes,{bytesPerRow:width*4},[width,height]);for(let i=0;i<width*height;i++)bytes.set([128,128,255,80+(i%120)],i*4);device.queue.writeTexture({texture:normal},bytes,{bytesPerRow:width*4},[width,height]);device.queue.writeTexture({texture:velocity},new Uint16Array(width*height*2),{bytesPerRow:width*4},[width,height]);await device.queue.onSubmittedWorkDone();return{color,normal,velocity,depth,destroy(){color.destroy();normal.destroy();velocity.destroy();depth.destroy();}};}
async function readHash(device,texture,width,height){const row=Math.ceil(width*8/256)*256,read=device.createBuffer({size:row*height,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ}),encoder=device.createCommandEncoder();encoder.copyTextureToBuffer({texture},{buffer:read,bytesPerRow:row},[width,height]);device.queue.submit([encoder.finish()]);await read.mapAsync(GPUMapMode.READ);const bytes=new Uint8Array(read.getMappedRange()),hash=hashBytes(bytes),nonzero=bytes.reduce((n,v)=>n+(v!==0),0);read.unmap();read.destroy();return{hash,nonzero};}
async function runOnce(device,scenario,timed){const width=scenario.width,height=scenario.height,res=await resources(device,width,height),rayQuery=scenario.rayQuery?makeRayQuery(device):null,pipeline=new AdvancedLightingPipeline(device,{foveation:scenario.foveation,rayQuery,giOptions:{checkerboard:true},rayBridgeOptions:{checkerboard:true}}),quality=new AdvancedLightingQualityController(pipeline,{level:scenario.level,cooldownFrames:0}),camera={projectionMatrix:new Matrix4(),matrixWorldInverse:new Matrix4(),position:{x:0,y:0,z:0}},inputs={colorView:res.color.createView(),depthView:res.depth.createView(),normalView:res.normal.createView(),velocityView:res.velocity.createView(),width,height,lights:makeLights(scenario.lights),materials:[{color:[.8,.7,.6],roughness:.5}]};pipeline.setQualityController(quality);const encode=[],complete=[];for(let i=0;i<warmupFrames+measuredFrames;i++){const start=performance.now();pipeline.execute(inputs,camera);const submitted=performance.now();await device.queue.onSubmittedWorkDone();const finished=performance.now();if(i>=warmupFrames){encode.push(submitted-start);complete.push(finished-start);}}const output=await readHash(device,pipeline.outputTexture,width,height),report=pipeline.report();pipeline.dispose();quality.dispose();res.destroy();if(rayQuery){rayQuery.nodebuffer.destroy();rayQuery.trilistbuffer.destroy();rayQuery.tridatabuffer.destroy();}return{encode,complete,output,report};}
async function main(){if(!navigator.gpu)throw new Error("WebGPU unavailable");const adapter=await navigator.gpu.requestAdapter({forceFallbackAdapter:true});if(!adapter)throw new Error("WebGPU adapter unavailable");const device=await adapter.requestDevice(),errors=[];device.addEventListener("uncapturederror",event=>errors.push(event.error.message));const scenarios=[{name:"balanced-32-lights",width:96,height:64,lights:32,level:2,foveation:false,rayQuery:false},{name:"hybrid-bvh-16-lights",width:96,height:64,lights:16,level:2,foveation:false,rayQuery:true},{name:"foveated-ultra-64-lights",width:128,height:72,lights:64,level:4,foveation:{mapScale:.25},rayQuery:false}],results=[];for(const scenario of scenarios){const measured=await runOnce(device,scenario,true),replay=await runOnce(device,scenario,false);results.push({scenario,encodeSubmit:summary(measured.encode),queueCompletion:summary(measured.complete),outputHash:measured.output.hash,replayHash:replay.output.hash,outputNonzeroBytes:measured.output.nonzero,deterministic:measured.output.hash===replay.output.hash,estimatedLightingBytes:estimateBytes(scenario.width,scenario.height,scenario.foveation,scenario.rayQuery),workload:{passes:measured.report.stats.passes,candidateTests:measured.report.direct.stats.candidateTests,spatialReuseTests:measured.report.direct.stats.spatialReuseTests,giRays:measured.report.gi.stats.estimatedRays,giTraceSteps:measured.report.gi.stats.estimatedTraceSteps,reflectionTraceSteps:measured.report.reflections.stats.estimatedMaxTraceSteps,filterTaps:measured.report.denoiser.stats.filterTaps,rayBridgeRays:measured.report.rayQuery?measured.report.rayQuery.stats.rays:0},quality:measured.report.quality?.quality||null});}await device.queue.onSubmittedWorkDone();const info=adapter.info?{vendor:adapter.info.vendor,architecture:adapter.info.architecture,device:adapter.info.device,description:adapter.info.description}:null,report={suite:"FaoxomJS advanced lighting reproducible benchmark",schemaVersion:1,date:new Date().toISOString(),protocol:{warmupFrames,measuredFrames,serialQueueCompletion:true,seed:1717,outputHash:"FNV-1a over padded rgba16float readback",timing:"performance.now around encode+submit and queue.onSubmittedWorkDone; queueCompletion is not a hardware timestamp"},environment:{userAgent:navigator.userAgent,adapter:info,timestampQuery:adapter.features.has("timestamp-query"),limits:{maxStorageTexturesPerShaderStage:adapter.limits.maxStorageTexturesPerShaderStage,maxStorageBuffersPerShaderStage:adapter.limits.maxStorageBuffersPerShaderStage}},errors,results};report.pass={noWebGPUErrors:errors.length===0,finiteTimings:results.every(x=>Number.isFinite(x.queueCompletion.p95Ms)&&x.queueCompletion.p95Ms>0),nonzeroOutputs:results.every(x=>x.outputNonzeroBytes>0),deterministicReplay:results.every(x=>x.deterministic)};report.pass.goalReached=Object.values(report.pass).every(Boolean);device.destroy();return report;}
window.__advancedLightingBenchmarkPromise=main().then(report=>{window.__advancedLightingBenchmark=report;document.getElementById("output").textContent=JSON.stringify(report,null,2);return report;}).catch(error=>{window.__advancedLightingBenchmark={error:error.stack||String(error),pass:{goalReached:false}};document.getElementById("output").textContent=window.__advancedLightingBenchmark.error;return window.__advancedLightingBenchmark;});
</script>
