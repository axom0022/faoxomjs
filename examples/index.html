<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FaoxomJS demo gallery</title>
<style>
    :root {
        color-scheme: dark;
        --panel: #10151c;
        --line: #1e2733;
        --text: #d7e2ee;
        --muted: #7d8fa3;
        --accent: #4fc3f7;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-columns: 232px 1fr;
        background: #070a0e;
        color: var(--text);
        font: 14px/1.45 ui-sans-serif, system-ui, sans-serif;
    }
    aside {
        border-right: 1px solid var(--line);
        background: var(--panel);
        padding: 18px 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        overflow: auto;
    }
    h1 {
        font-size: 15px;
        margin: 0 0 4px;
        letter-spacing: .02em;
    }
    aside p {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 12px;
    }
    #demos {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    #demos button {
        appearance: none;
        border: 1px solid transparent;
        background: transparent;
        color: var(--text);
        text-align: left;
        padding: 8px 10px;
        border-radius: 6px;
        cursor: pointer;
        font: inherit;
    }
    #demos button:hover { background: #182231; }
    #demos button.active {
        background: #17293b;
        border-color: #294a66;
        color: #ffffff;
    }
    main {
        position: relative;
        display: flex;
        flex-direction: column;
        min-width: 0;
    }
    #stage {
        flex: 1;
        min-height: 0;
        position: relative;
    }
    footer {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 8px 12px;
        border-top: 1px solid var(--line);
        background: var(--panel);
        color: var(--muted);
        font-size: 12px;
    }
    #fps { color: var(--accent); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<aside>
    <h1>FaoxomJS</h1>
    <p>Demo gallery</p>
    <nav id="demos"></nav>
</aside>
<main>
    <div id="stage"></div>
    <footer>
        <span id="status">loading</span>
        <span id="fps">- fps</span>
    </footer>
</main>
<script type="module" src="./faoxomgallery.js"></script>
</body>
</html>
